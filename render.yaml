# ─────────────────────────────────────────────────────────────
# Render Blueprint Specification
# Deploy in 1 click at https://dashboard.render.com/blueprints
# ─────────────────────────────────────────────────────────────
services:
  - type: web
    name: ai-study-companion
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/auth/me
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false # Set in Render Dashboard environment variables
